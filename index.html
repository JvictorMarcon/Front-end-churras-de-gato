<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Sistema de Gestão - Churras de Gato</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        /* Toast Animation */
        .toast {
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        /* Expired Badge Animation */
        .expired-badge {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }
        
        /* Modal Animation */
        .modal {
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        /* Badge Styles */
        .unit-badge {
            background-color: #7F3E11;
            color: #FFFFFF;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
            white-space: nowrap;
            display: inline-block;
        }
        
        .kilo-badge {
            background-color: #D36B1A;
            color: #FFFFFF;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
            white-space: nowrap;
            display: inline-block;
        }
        
        /* Search Highlight */
        .search-highlight {
            background-color: rgba(211, 107, 26, 0.3);
            font-weight: bold;
            border-radius: 2px;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #0A0A0A;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #7F3E11;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #D36B1A;
        }
        
        /* Mobile Menu Styles */
        .mobile-menu-open {
            overflow: hidden;
        }
        
        /* Sidebar transition */
        .sidebar-transition {
            transition: transform 0.3s ease-in-out;
        }
        
        /* Main content transition */
        .main-content-transition {
            transition: margin-left 0.3s ease-in-out;
        }
        
        /* Chart Responsive */
        canvas {
            max-height: 300px;
            width: 100% !important;
        }
        
        /* Table Responsive */
        @media (max-width: 768px) {
            .table-container {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
        }
        
        /* Ajustes para telas grandes */
        @media (min-width: 1024px) {
            .sidebar-open {
                margin-left: 16rem;
            }
        }
        
        /* Hide scrollbar for clean look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#0A0A0A]">
    <!-- Mobile Menu Button - Reposicionado para não sobrepor -->
    <button id="mobileMenuBtn" class="lg:hidden fixed top-4 left-4 z-50 bg-[#D36B1A] text-white p-3 rounded-lg shadow-lg hover:bg-[#7F3E11] transition-all">
        <i class="fas fa-bars text-xl"></i>
    </button>
    
    <!-- Overlay para mobile -->
    <div id="mobileOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden lg:hidden" onclick="closeMobileMenu()"></div>
    
    <!-- Sidebar -->
    <div id="sidebar" class="fixed top-0 left-0 z-50 w-64 h-full bg-[#161616] border-r border-[#7F3E11] transform -translate-x-full lg:translate-x-0 lg:relative lg:z-auto sidebar-transition overflow-y-auto">
        <div class="p-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold text-[#D36B1A]">
                        <i class="fas fa-drumstick-bite mr-2"></i>
                        Churras de Gato
                    </h1>
                    <p class="text-[#C2C2C2] text-sm mt-2">Sistema de Gestão</p>
                </div>
                <button id="closeMobileMenu" class="lg:hidden text-[#C2C2C2] hover:text-[#FFFFFF] transition-all">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>
        </div>
        
        <nav class="mt-8">
            <a href="#" onclick="showDashboard(); return false;" class="nav-item active flex items-center px-6 py-3 text-[#C2C2C2] hover:bg-[#7F3E11] hover:text-[#FFFFFF] transition-all">
                <i class="fas fa-chart-line w-5 mr-3"></i>
                <span>Dashboard</span>
            </a>
            <a href="#" onclick="showEstoque(); return false;" class="nav-item flex items-center px-6 py-3 text-[#C2C2C2] hover:bg-[#7F3E11] hover:text-[#FFFFFF] transition-all">
                <i class="fas fa-boxes w-5 mr-3"></i>
                <span>Gerenciar Estoque</span>
            </a>
            <a href="#" onclick="showRetiradas(); return false;" class="nav-item flex items-center px-6 py-3 text-[#C2C2C2] hover:bg-[#7F3E11] hover:text-[#FFFFFF] transition-all">
                <i class="fas fa-clipboard-list w-5 mr-3"></i>
                <span>Registro de Retiradas</span>
            </a>
        </nav>
    </div>
    
    <!-- Main Content -->
    <div id="mainContent" class="min-h-screen lg:ml-64 main-content-transition">
        <!-- Header - Adicionando padding-top no mobile para não ficar atrás do botão -->
        <div class="bg-[#161616] border-b border-[#7F3E11] px-4 sm:px-8 py-4 sticky top-0 z-30">
            <div class="flex justify-between items-center">
                <h2 class="text-lg sm:text-xl font-semibold text-[#FFFFFF]" id="pageTitle">
                    <i class="fas fa-chart-line mr-2"></i>Dashboard
                </h2>
                <div class="text-[#C2C2C2] flex items-center">
                    <i class="fas fa-user-circle text-2xl"></i>
                    <span class="ml-2 hidden sm:inline">Administrador</span>
                </div>
            </div>
        </div>
        
        <!-- Content Area -->
        <div id="contentArea" class="p-4 sm:p-6 lg:p-8">
            <!-- Dynamic content will be loaded here -->
        </div>
    </div>
    
    <!-- Toast Container - Reposicionado para não ser coberto -->
    <div id="toastContainer" class="fixed top-20 right-4 sm:right-5 z-50 space-y-3"></div>
    
    <!-- Modal Container -->
    <div id="modalContainer"></div>
    
    <script src="script.js"></script>
</body>
</html>
